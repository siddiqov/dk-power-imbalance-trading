# ==============================================================================
# Nurex V4.1 Intraday — configuration
# Loaded ON TOP of Nurex_V4_2/config.yaml (same database, same risk engine).
# Only the keys below are overridden.
# All money in EUR, volumes in MWh per 15-minute quarter, all times UTC unless *_local.
# ==============================================================================

# --- Trading moment ------------------------------------------------------------
intraday:
  # Schedule of the trading decisions:
  #   batch = client schedule (2026-09-27): every hour the next hour's 4 quarters are LOCKED and
  #           sent 2h15 before their first quarter (e.g. 21:45 -> Q1-Q4 = 00:00-00:45 next day,
  #           07:45 -> Q41-Q44 = 10:00-10:45). All later quarters stay PROVISIONAL and are
  #           re-forecast every cycle. Settings: see `batch_schedule` below.
  #   gate  = original V4.1: every quarter decided on its own, gate_lead_minutes before delivery.
  # Each mode has its own models, journal and reports (see batch_schedule), so switching back
  # and forth never mixes the two track records.
  mode: batch
  # Decision time = delivery start - gate_lead_minutes.
  # 60 = Nordic cross-border intraday gate closure (confirm Danish local gate closure with the BRP).
  gate_lead_minutes: 60
  # Extra leads used ONLY as additional training rows (same quarter, earlier information).
  # lead_min is a model feature, so the model learns how information decays.
  train_extra_leads_minutes: [90]
  # Retraining cadence in the walk-forward replay
  retrain_every_days: 30
  min_train_days: 120
  validation_days: 90   # REC-04: extended for DK2 BUY audit; re-run run_train_v41.bat
  # Paper-trading journal: decisions are locked this many minutes before their gate closure
  lock_ahead_minutes: 20
  # Stale-data guard: if imbalance/PSRN data is older than this many minutes at
  # decision time, force HOLD rather than trading on NaN features.
  # lag + tolerance: imbalance_lag_minutes (30) + 60 min tolerance = 90 min.
  stale_data_guard_minutes: 90

# --- Point-in-time availability (minutes after the 15-min quarter END) ---------
# Observed on Energi Data Service 17 Sep 2026: satisfied demand / aFRR volumes of the
# last quarter appeared within ~7 min, the imbalance price within ~22 min.
# The values below keep a safety margin; raise them if the BRP/EDS feed is slower.
availability:
  imbalance_lag_minutes: 30          # imbalance PRICE (spread) of a quarter
  fast_state_lag_minutes: 15         # satisfied demand (NRV), dominating direction, aFRR volumes
  psrn_lag_minutes: 5                # PowerSystemRightNow 1-min data, 15-min buckets
  forecast_1h_minutes_before: 60     # Forecast1Hour known 60 min before delivery
  entsoe_actual_lag_minutes: 90      # ENTSO-E actual load / physical flows (after quarter end)
  entsoe_dayahead_publish_local: "13:00"   # load forecast, schedules, NTC (D-1)
  entsoe_wsfc_publish_local: "18:00"       # wind & solar day-ahead forecast (D-1)
  weather_known_before_minutes: 1440 # Open-Meteo previous-day run
  frequency_lag_minutes: 5           # Fingrid 3-min frequency

# --- Cost model for an intraday position left open into imbalance settlement ---
# ASSUMPTIONS until the BRP contract / Nord Pool intraday fee sheet is confirmed.
# The traded price is approximated by the day-ahead price + slippage, because no
# Nord Pool intraday price history is available yet.
costs:
  nordpool_dayahead_eur_mwh: 0.20    # used here as the Nord Pool INTRADAY trading fee (assumption)
  imbalance_fee_eur_mwh: 1.15
  brp_service_eur_mwh: 0.50
  slippage_eur_mwh: 0.50             # half bid-ask of a thin Danish 15-min contract (assumption)
  stress_multiplier: 2.0

# --- Risk (per quarter, no batches intraday) ------------------------------------
risk:
  batch_risk_fraction: 0.10          # stressed loss of ONE quarter <= 10% of collateral
  max_mwh_per_quarter: 10.0
  # Aggregate hourly exposure cap: total MWh locked across all four quarters of one
  # delivery hour must not exceed this. With max_mwh_per_quarter = 10.0 and four
  # quarters per hour the uncapped hourly risk is 40 MWh; this cap limits it to 20 MWh
  # (≤ 2× the per-quarter stressed loss).  FIX audit #6.
  max_mwh_per_hour: 20.0
  drawdown_window_days: 7            # drawdown guard looks at the equity peak of the last 7 days

decision:
  margin_grid: [0.0, 2.0, 5.0, 10.0, 20.0, 40.0]
  prob_grid: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
  # Fallback BUY rule (2026-09-28). Used ONLY while the trained model has no validated BUY rule
  # ("buy": null in the model file); a BUY rule found by the Sunday retrain replaces it.
  # Chosen on the batch walk-forward replay Jul 2025 - Sep 2026 (out-of-sample, 1 MWh/trade):
  #   DK1 1,522 trades +17,840 EUR (11.7 EUR/MWh, 13/15 months positive, last 90 days +5,210)
  #   DK2   607 trades +25,558 EUR (42.1 EUR/MWh, last 90 days -200)
  # Profit comes from rare up-spikes (win rate ~33%, median trade -2.4 EUR/MWh), hence a small
  # fixed size. The q10 crash guard does not apply to fallback BUYs; all other risk limits do.
  # BUY crash guard (BUY -> HOLD when the model's q10 < q10_eur). 2026-10-05: OFF by default.
  # Walk-forward test Jul 2025 - Sep 2026: guard at -30 cut DK1 logistic 69.1k -> 27.5k and DK1
  # LightGBM 25.2k -> 14.4k (DK2 unchanged). The dashboard checkbox "BUY crash guard" overrides
  # `enabled` on this machine (results/v4_1_intraday/live_controls.json) from the next cycle.
  buy_crash_guard:
    enabled: false
    q10_eur: -30.0
  # Decision guards, tuned per retrain on the validation window (kept only if they improve
  # validation net and stay positive in both halves; otherwise no guard):
  #   SELL -> HOLD when P(up-spike) is high; BUY -> HOLD when P(down-spike) is high;
  #   any  -> HOLD when P(flat quarter, imbalance price = spot) is high (such trades only pay costs)
  guards:
    enabled: true
    spike_grid: [0.10, 0.15, 0.20, 0.30]
    flat_grid: [0.40, 0.50, 0.60, 0.70]
  fallback_buy:
    enabled: true
    areas: [DK1, DK2]
    pmin: 0.40               # model probability that the spread is UP
    margin_eur: 10.0         # expected spread must exceed costs + this margin (EUR/MWh)
    mwh: 0.2                 # fixed size per quarter
    kill_loss_eur: 300.0     # switch off when fallback BUYs lost more than this ...
    kill_window_days: 30     # ... over the last N days of settled quarters

# --- Models per zone (2026-10-04) --------------------------------------------------
# recommended = the model whose decisions are LOCKED and sent to the client (lgbm | logreg).
# A zone whose recommended model is not lgbm also runs LightGBM in a shadow journal
# (data/v41_batch_journal_shadow_lgbm.sqlite) so the dashboard tournament compares both.
# Stage 4 research (walk-forward Jul 2025 - Sep 2026, settings chosen on validation only):
#   DK1 all features: logistic EUR 69.1k (36.1k / 32.9k halves, DD -3.5k) vs LightGBM 25.2k
#   DK2: LightGBM 24.7k stays (logistic not reliably better).
# Switching back: set the zone to lgbm and restart the cycle (both models are always trained).
models:
  recommended:
    DK1: logreg
    DK2: lgbm

# Logistic regression (v4_1_intraday/model_logreg.py): every retrain tries C_grid x
# class_weight_grid, tunes BUY/SELL thresholds on the 90-day validation window for each,
# and keeps the one with the best validation PnL. All features (same columns as LightGBM).
logreg:
  C_grid: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  class_weight_grid: [balanced, null]     # balanced = up / down / flat weighted equally
  ridge_alpha: 10.0                        # expected-size regressors (up / down quarters)
  max_iter: 1000

model:
  direction_deadband_eur: 0.5
  # --- 2026-09-28 upgrade (model_v41.SpreadModelV41). false = the original two-part model ---
  # Full replay 28 Sep (Jul 2025-Sep 2026) with everything on: forecast error improved (DK1 MAE
  # 68.4 -> 59.6) but trading got worse in DK1 (net 24,691 -> 14,251 EUR, max DD -3,180 -> -7,319)
  # and only slightly better in DK2 (10,512 -> 11,569, DD -6,061 -> -7,223). Kept OFF until the
  # parts are tested one by one. Results: results/v4_1_batch_eval/.
  enhanced: false
  # 16 mFRR activation-volume inputs (features_id.py): true / false / list of zones.
  # mFRR-only replay 28 Sep (Jul 2025-Sep 2026, same settings as live):
  #   DK1: net 24,691 -> 17,921 EUR, max DD -3,349 -> -5,707  -> off
  #   DK2: net 10,512 -> 20,471 EUR, max DD -6,440 -> -4,263  -> on
  # Takes effect when the models are retrained (weekly, Sunday 03:00).
  mfrr_volume_features: [DK2]
  # Safeguard for the Nord Pool intraday-market inputs (id15_/id60_/book15_/trd15_): they enter
  # training only when switched on here (after a replay shows they help) AND each has values for
  # at least intraday_market_min_days x 96 quarters. Until then the model ignores them.
  intraday_market_features: false
  intraday_market_min_days: 90
  size_objective: huber          # size regressors: huber (robust to spikes) | regression (squared error)
  huber_delta: 40.0              # EUR/MWh; errors beyond this count linearly, not squared
  recency_half_life_days: 180    # training row weight halves every 180 days of age
  spike_level_eur: 150.0         # spike classifiers: P(spread > +150) and P(spread < -150)
  lgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 100
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.7
    reg_lambda: 2.0
    verbose: -1
    n_jobs: 2

# --- Nord Pool Intraday API (read-only, live market data) ------------------------
# Credentials: NORDPOOL_ID_USERNAME / NORDPOOL_ID_PASSWORD in Nurex_V4_2/.env
# Hosts follow Nord Pool's public example (test hosts have ".test."); override if Nord Pool
# gives you different production addresses.
intraday_api:
  sso_url: https://sso.nordpoolgroup.com/connect/token
  market_data_host: intraday-pmd-api-ws-nordpool.nordpoolgroup.com
  price_divisor: 100.0        # API prices are EUR cents
  qty_divisor: 1000.0         # API quantity -> MW (verify with `probe-nordpool`)
  area_ids: {}                # e.g. {DK1: 1, DK2: 2} only if deliveryAreas is not received
intraday_data_dir: Nurex_V4_2/data/nordpool_id

# PSRN flow-sign convention is calibrated on the first N days of the store only
# (never on the full history - that would be a look-ahead; see features_ext._psrn_sign_for)
sign_calibration_days: 45

models_dir: models_v4_1_intraday
journal_path: data/v41_journal.sqlite
reports_dir: results/v4_1_intraday

# --- Client batch schedule (used when intraday.mode = batch) -----------------------
batch_schedule:
  quarters_per_batch: 4          # one delivery hour per batch (local wall-clock hours)
  lead_minutes: 135              # batch deadline = first quarter start - 2h15
  final_run_minutes: 15          # final forecast uses data up to deadline - 15 min (= 2h30 before)
  # Extra training copies of every quarter at longer leads (minutes before delivery). The batch
  # rows already cover 150-195 min; the extras teach the model how information decays for the
  # provisional quarters further ahead.
  train_extra_leads_minutes: [240]
  # Own storage for batch mode (never mixed with the gate-mode track record)
  models_dir: models_v4_1_batch
  journal_path: data/v41_batch_journal.sqlite
  reports_dir: results/v4_1_batch
  batch_files_dir: results/v4_1_batch/batches   # one CSV + JSON per locked batch (for the BRP)
